services:
  l4d2:
    build: .
    container_name: l4d2
    restart: unless-stopped
    environment:
      - STEAM_USER=${USER_STEAM}
      - STEAM_PASS=${PASS_STEAM}
    volumes:
      - ${DIR_VOLUME}
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "27005:27005/udp"
      - "27020:27020/udp"
